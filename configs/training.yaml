# LayoutLM fine-tune on FUNSD — modest-GPU friendly defaults
model_name: microsoft/layoutlmv3-base
fallback_model_name: microsoft/layoutlmv2-base-uncased
prefer_v3: true

data_dir: ./data/funsd
output_dir: ./artifacts/checkpoints/funsd-layoutlm
max_seq_length: 512

# Small batch + grad accum for local Windows GPUs
per_device_train_batch_size: 2
per_device_eval_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 5.0e-5
weight_decay: 0.01
num_train_epochs: 5
max_steps: null  # set e.g. 2 for smoke runs
warmup_ratio: 0.1
logging_steps: 10
eval_strategy: epoch
save_strategy: epoch
save_total_limit: 2
seed: 42
fp16: false  # enable if CUDA + Ampere-friendly setup
dataloader_num_workers: 0  # Windows-safe

label_list:
  - "O"
  - "B-HEADER"
  - "I-HEADER"
  - "B-QUESTION"
  - "I-QUESTION"
  - "B-ANSWER"
  - "I-ANSWER"
