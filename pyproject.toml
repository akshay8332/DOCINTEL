[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docintel"
version = "0.1.0"
description = "Document intelligence pipeline — FUNSD LayoutLM Stage 1 + extraction API stubs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Haripriya Joshi" }]
dependencies = [
  "pydantic>=2.5,<3",
  "pydantic-settings>=2.1,<3",
  "pyyaml>=6.0",
  "torch>=2.1",
  "transformers>=4.38",
  "datasets>=2.16",
  "accelerate>=0.27",
  "seqeval>=1.2",
  "Pillow>=10.0",
  "pypdfium2>=4.25",
  "numpy>=1.24",
  "httpx>=0.26",
  "tqdm>=4.66",
  "fastapi>=0.109",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.2",
]

[project.scripts]
docintel-train-funsd = "docintel.workers.train_funsd:main"
docintel-download-funsd = "docintel.data.funsd:cli_download"

[tool.hatch.build.targets.wheel.sources]
"packages" = ""

[tool.hatch.build.targets.sdist]
include = ["packages/docintel", "configs", "scripts", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages"]

[tool.ruff]
line-length = 100
target-version = "py310"
