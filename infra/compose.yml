# Local parity sketch (Stage 3) — API + SQLite volume; Redis optional
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "8080:8080"
    env_file:
      - ../.env.example
    volumes:
      - ../artifacts:/app/artifacts
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # redis:
