name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: packages:experiments
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU PyTorch and the package
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          # Keep the CPU wheel. A plain pip install of the package can replace it
          # with a CUDA build from PyPI.
          TORCH_VER=$(python -c "import torch; print(torch.__version__)")
          pip install -e ".[dev]" "torch==${TORCH_VER}" --extra-index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; assert torch.version.cuda is None, torch.__version__"

      - name: Run pytest
        run: python -m pytest -q --tb=short

  frontend:
    name: Vue production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install and build
        working-directory: apps/web
        run: |
          npm ci
          npm run build

      - name: Upload dist for the web image
        uses: actions/upload-artifact@v6
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 3

  docker-web:
    name: Docker web image
    runs-on: ubuntu-latest
    needs: [test, frontend]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v6
        with:
          name: web-dist
          path: apps/web/dist

      - name: Build web image
        run: docker build -f docker/Dockerfile.web -t docintel-web:ci .

  docker-api:
    name: Docker API image
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t docintel-api:ci .

      # Images stay on the runner. ECR push is a later step after the AWS account check.
